<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Sertifikat</title>

<style>
body{
margin:0;
font-family:Arial;
background:#f5f7fb;
}

/* Splash Screen */
.splash{
position:fixed;
width:100%;
height:100vh;
background:#00695c;
color:white;
display:flex;
justify-content:center;
align-items:center;
z-index:999;
font-size:30px;
}

/* Container */
.container{
padding:25px;
max-width:400px;
margin:auto;
margin-top:100px;
}

/* Input */
input{
width:100%;
padding:15px;
border-radius:12px;
border:1px solid #ccc;
margin-top:15px;
font-size:16px;
}

/* Button */
button{
width:100%;
padding:15px;
background:#00695c;
color:white;
border:none;
border-radius:12px;
margin-top:15px;
font-size:16px;
cursor:pointer;
}

/* Card */
.card{
background:white;
padding:20px;
border-radius:15px;
margin-top:20px;
box-shadow:0 5px 15px rgba(0,0,0,.1);
}
</style>

</head>

<body>

<!-- SPLASH -->
<div class="splash" id="splash">
<h1>PGM INDONESIA</h1>
</div>

<!-- MAIN -->
<div class="container">

<h2>Cek Sertifikat</h2>

<input type="text" id="nik" placeholder="Masukkan NIK">

<button onclick="cekData()">CEK DATA</button>

<div id="hasil"></div>

</div>

<script>
// Splash hilang
setTimeout(()=>{
document.getElementById("splash").style.display="none";
},2000);

// CEK DATA
async function cekData(){

const nik = document.getElementById("nik").value;
const hasil = document.getElementById("hasil");

hasil.innerHTML="Loading...";

// GANTI INI DENGAN URL WEB APP GOOGLE SCRIPT KAMU
const url = "https://script.google.com/macros/s/AKfycbzeu0BNbOEXI_LEMl09x76-AhZwWtEdGC9b5hbBq_kz4YA38l6TdWJSZqQJdI8taZYuSA/exec=" + nik;

try {

const res = await fetch(url);
const data = await res.json();

// DATA TIDAK DITEMUKAN
if(data.status == false){
hasil.innerHTML = `
<div class="card">
<h3>Data tidak ditemukan</h3>
<a href="https://docs.google.com/forms/d/e/1FAIpQLSdH_u5r3WfNFy1GiKZiwADM4APD586MGgsUmvTXGwq5cYaGlA/viewform">
<button>ISI FORM PENDATAAN</button>
</a>
</div>`;
return;
}

// BELUM BAYAR
if(data.bayar == "BELUM"){
hasil.innerHTML = `
<div class="card">
<h3>Silahkan lakukan pembayaran</h3>
<a href="https://docs.google.com/forms/d/11Tx6Qxfwuw2dcpKNngb_ESI9e_RFiFCyH6a4SishDuo/edit">
<button>UPLOAD BUKTI</button>
</a>
</div>`;
return;
}

// MASIH VALIDASI
if(data.validasi == "VALIDASI"){
hasil.innerHTML = `
<div class="card">
<h3>Bukti sedang divalidasi admin</h3>
</div>`;
return;
}

// DITOLAK
if(data.validasi == "DITOLAK"){
hasil.innerHTML = `
<div class="card">
<h3>Bukti ditolak</h3>
<p>${data.ket}</p>
<a href="https://docs.google.com/forms/d/11Tx6Qxfwuw2dcpKNngb_ESI9e_RFiFCyH6a4SishDuo/edit">
<button>UPLOAD ULANG</button>
</a>
</div>`;
return;
}

// VALID (LOLOS)
if(data.validasi == "VALID"){
hasil.innerHTML = `
<div class="card">
<h2>${data.nama}</h2>
<a href="${data.sertifikat}">
<button>DOWNLOAD SERTIFIKAT</button>
</a>
</div>`;
return;
}

} catch (error) {
hasil.innerHTML = `
<div class="card">
<h3>Terjadi kesalahan server</h3>
</div>`;
}

}
</script>

</body>
</html>
